<!-- same lightbox as in Gallery -->
<div class="lightbox" id="lightbox" aria-hidden="true">
  <div class="lightbox-backdrop" data-close></div>
  <div class="lightbox-panel" role="dialog" aria-modal="true" aria-label="View photo full-size">
    <button class="lightbox-close" type="button" data-close aria-label="Close">✕</button>
    <img class="lightbox-img" id="lightboxImg" alt="">
    <p class="lightbox-caption" id="lightboxCaption"></p>
  </div>
</div>

<script>
  const shots = document.querySelectorAll(".shot");
  const lb = document.getElementById("lightbox");
  const lbImg = document.getElementById("lightboxImg");
  const lbCap = document.getElementById("lightboxCaption");

  function openLightbox(src, caption) {
    lbImg.src = src;
    lbCap.textContent = caption || "";
    lb.setAttribute("aria-hidden", "false");
    document.body.classList.add("no-scroll");
  }

  function closeLightbox() {
    lb.setAttribute("aria-hidden", "true");
    lbImg.src = "";
    lbCap.textContent = "";
    document.body.classList.remove("no-scroll");
  }

  shots.forEach(btn => btn.addEventListener("click", () => openLightbox(btn.dataset.src, btn.dataset.caption)));
  lb.addEventListener("click", (e) => { if (e.target !== lbImg) closeLightbox(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });
</script>
